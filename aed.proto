syntax = "proto3";

package aed;

option go_package = "github.com/sologenic/com-fs-aed-model;aed";

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "sologenic/com-fs-utils-lib/models/metadata/metadata.proto";

message AEDs {
    repeated AED AEDs = 1;
}

message AED {
    // Non-billing: OPEN/HIGH/LOW/CLOSE/FIRST_PRICE/LAST_PRICE must be > 0 when set.
    // BILLING (4): those fields may be 0 (empty balance) but must not be negative.
    // VOLUME may be 0 on any series. All floats still require finite on Value.
    option (buf.validate.message).cel = {
        id: "ohlc_float_gt_zero_non_billing"
        message: "OPEN/HIGH/LOW/CLOSE/FIRST_PRICE/LAST_PRICE Float64Val must be greater than 0 when set (non-billing)"
        expression: "this.Series == 4 || this.Value.all(v, !(v.Field in [1, 2, 3, 4, 14, 15]) || !has(v.Float64Val) || v.Float64Val > 0.0)"
    };
    option (buf.validate.message).cel = {
        id: "ohlc_float_gte_zero_billing"
        message: "OPEN/HIGH/LOW/CLOSE/FIRST_PRICE/LAST_PRICE Float64Val must be greater than or equal to 0 when set (billing)"
        expression: "this.Series != 4 || this.Value.all(v, !(v.Field in [1, 2, 3, 4, 14, 15]) || !has(v.Float64Val) || v.Float64Val >= 0.0)"
    };

    string OrganizationID = 1;
    string Symbol = 2; // Denom1:Denom2
    google.protobuf.Timestamp Timestamp = 3;
    Period Period = 4;
    metadata.MetaData MetaData = 5;
    optional string UserID = 6; // Time series stored at user level for profit/loss, etc

    repeated Value Value = 100;
    Series Series = 101;
    optional Source Source = 102;
}

enum Source {
    SOURCE_NOT_USED = 0;
    SOURCE_EXCHANGE = 1; // Source: exchange trades
    SOURCE_ATS = 2; // Alternative Trading System
    SOURCE_DEX = 3; // Decentralized Exchange + AMM (anywhere on the blockchain)
    SOURCE_INTERNAL = 4; // eg. admin dashboard
}

enum Series {
    SERIES_NOT_USED = 0;
    INTERNAL_TRADES = 1; // Source: dex trades, Usage: general trade graphs, supports TradeView-like graphing tools (ohlc)
    MARKET_DATA_STOCKS = 2; // Source: external market data provider for the general stock market (can be more than 1 provider, but only a single provider per stock)
    USER_PERFORMANCE = 3; // Source: user account data, Usage: tracks user's portfolio/trading performance over various time periods
    BILLING = 4; // Source: billing data, Usage: tracks billing data for the organization
    REFERRAL = 5; // Source: referral data, Usage: tracks referral data for the organization
}

message Value {
    Field Field = 1 [
        (buf.validate.field).enum = {
            defined_only: true
        }
    ];
    optional string StringVal = 2; // String value
    optional int64 Int64Val = 3 [
        (buf.validate.field).int64 = {gte: 0}
    ]; // Integer value
    // Reject NaN / Inf. Price-like positivity is enforced on AED by series.
    optional double Float64Val = 4 [
        (buf.validate.field).double = {finite: true}
    ]; // Float value
    optional bool BoolVal = 5; // Boolean value
}

enum Field {
    FIELD_NOT_USED = 0;
    OPEN = 1;
    HIGH = 2;
    LOW = 3;
    CLOSE = 4;
    VOLUME = 5;
    NUMBER_OF_TRADES = 6;
    INVERTED_VOLUME = 7;
    MARKET_CAP = 8;
    EPS = 9;
    PE_RATIO = 10;
    YIELD = 11;
    OPEN_TIME = 12;
    CLOSE_TIME = 13;
    FIRST_PRICE = 14;    // First price in the time window
    LAST_PRICE = 15;     // Last price in the time window
}

message Period {
    PeriodType Type = 1 [
        (buf.validate.field).enum = {
            defined_only: true
            not_in: [0]
        }
    ];
    int32 Duration = 2 [
        (buf.validate.field).int32 = {gt: 0}
    ]; // The duration of the indicated period (e.g 1 minute, 3 minutes, etc)
}

enum PeriodType {
    PERIOD_TYPE_DO_NOT_USE = 0;
    PERIOD_TYPE_MINUTE = 1;
    PERIOD_TYPE_HOUR = 2;
    PERIOD_TYPE_DAY = 3;
    PERIOD_TYPE_WEEK = 4;
    PERIOD_TYPE_MONTH = 5;
    PERIOD_TYPE_YEAR = 6;
}
