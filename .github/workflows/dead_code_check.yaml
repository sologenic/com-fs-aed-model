# THIS FILE IS AUTO-GENERATED. DO NOT EDIT!

name: Go Dead Code Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deadcode-check:
    name: Go Dead Code Check
    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/checkout
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # https://github.com/actions/setup-go
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Configure Git for private modules
        env:
          TOKEN: ${{ secrets.REPOSITORY_READ_ONLY_PAT }}
        run: |
          cat <<EOF > ~/.netrc
          machine github.com
          login x-oauth-basic
          password ${TOKEN}
          EOF
          chmod 600 ~/.netrc

      - name: Install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@latest

      - name: Run deadcode
        run: |
          # Run deadcode and exclude Protobuf files from the output
          DEADCODE_OUT=$(deadcode . | grep -v '\.pb\.go' || true)
          if [ -n "$DEADCODE_OUT" ]; then
            echo "::error::Dead code found:"
            echo "$DEADCODE_OUT"
            exit 1
          else
            echo "No dead code found!"
          fi
